<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#232f3e">MerideanCorp — AWS Architecture</text>

  <!-- Internet -->
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#555">Internet</text>
  <line x1="450" y1="66" x2="450" y2="90" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- VPC boundary -->
  <rect x="60" y="95" width="780" height="480" rx="6" fill="none" stroke="#232f3e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="75" y="112" font-size="12" fill="#232f3e" font-weight="bold">VPC 10.0.0.0/16</text>

  <!-- WAF -->
  <rect x="370" y="95" width="160" height="34" rx="4" fill="#ffecec" stroke="#c0392b" stroke-width="1.2"/>
  <text x="450" y="117" text-anchor="middle" font-size="12" fill="#c0392b">AWS WAF</text>

  <!-- Public tier -->
  <rect x="85" y="150" width="730" height="120" rx="5" fill="#eaf4ff" stroke="#3b7dd8"/>
  <text x="100" y="168" font-size="12" font-weight="bold" fill="#1a4d8f">Public Subnets (3 AZs)</text>

  <rect x="360" y="185" width="180" height="40" rx="4" fill="#ffffff" stroke="#3b7dd8" stroke-width="1.3"/>
  <text x="450" y="209" text-anchor="middle" font-size="12" fill="#1a4d8f">Application Load Balancer</text>

  <rect x="130" y="185" width="120" height="36" rx="4" fill="#ffffff" stroke="#3b7dd8"/>
  <text x="190" y="207" text-anchor="middle" font-size="10.5" fill="#1a4d8f">NAT GW (AZ-a)</text>
  <rect x="390" y="235" width="120" height="0" fill="none"/>
  <rect x="270" y="185" width="120" height="36" rx="4" fill="#ffffff" stroke="#3b7dd8"/>
  <text x="330" y="207" text-anchor="middle" font-size="10.5" fill="#1a4d8f">NAT GW (AZ-b)</text>
  <rect x="650" y="185" width="120" height="36" rx="4" fill="#ffffff" stroke="#3b7dd8"/>
  <text x="710" y="207" text-anchor="middle" font-size="10.5" fill="#1a4d8f">NAT GW (AZ-c)</text>

  <!-- App tier -->
  <rect x="85" y="295" width="730" height="120" rx="5" fill="#eafaf0" stroke="#2e9e5b"/>
  <text x="100" y="313" font-size="12" font-weight="bold" fill="#1c6b3d">Private App Subnets — Auto Scaling Group (3 AZs)</text>

  <rect x="230" y="335" width="140" height="50" rx="4" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.3"/>
  <text x="300" y="357" text-anchor="middle" font-size="11" fill="#1c6b3d">EC2 (AZ-a)</text>
  <text x="300" y="372" text-anchor="middle" font-size="9.5" fill="#4b8a67">no public IP · SSM only</text>

  <rect x="530" y="335" width="140" height="50" rx="4" fill="#ffffff" stroke="#2e9e5b" stroke-width="1.3"/>
  <text x="600" y="357" text-anchor="middle" font-size="11" fill="#1c6b3d">EC2 (AZ-b)</text>
  <text x="600" y="372" text-anchor="middle" font-size="9.5" fill="#4b8a67">no public IP · SSM only</text>

  <!-- Data tier -->
  <rect x="85" y="440" width="730" height="115" rx="5" fill="#fff6e8" stroke="#c9880b"/>
  <text x="100" y="458" font-size="12" font-weight="bold" fill="#8a5d05">Private Data Subnets — zero internet route (3 AZs)</text>

  <rect x="360" y="480" width="180" height="50" rx="4" fill="#ffffff" stroke="#c9880b" stroke-width="1.3"/>
  <text x="450" y="502" text-anchor="middle" font-size="12" fill="#8a5d05">RDS PostgreSQL</text>
  <text x="450" y="518" text-anchor="middle" font-size="9.5" fill="#a3781f">Single-AZ · encrypted · no public access</text>

  <!-- Secrets Manager -->
  <rect x="620" y="480" width="150" height="50" rx="4" fill="#f3eaff" stroke="#7b3fbf" stroke-width="1.2"/>
  <text x="695" y="500" text-anchor="middle" font-size="11" fill="#5a2a8f">Secrets Manager</text>
  <text x="695" y="515" text-anchor="middle" font-size="9" fill="#7b3fbf">DB credentials</text>

  <!-- Connections -->
  <line x1="450" y1="129" x2="450" y2="185" stroke="#888" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="450" y1="225" x2="450" y2="335" stroke="#888" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="300" y1="385" x2="450" y2="480" stroke="#888" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="600" y1="385" x2="450" y2="480" stroke="#888" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="600" y1="360" x2="695" y2="480" stroke="#7b3fbf" stroke-width="1.1" stroke-dasharray="3,2" marker-end="url(#arrowp)"/>

  <!-- Legend -->
  <text x="100" y="585" font-size="10" fill="#555">— solid: traffic flow</text>
  <text x="260" y="585" font-size="10" fill="#7b3fbf">- - purple: IAM-based credential retrieval</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#888"/>
    </marker>
    <marker id="arrowp" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7b3fbf"/>
    </marker>
  </defs>
</svg>
